services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # LISTENERS
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # SINGLE NODE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    depends_on:
      - kafka
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app

  alert:
    build: ./alert
    depends_on:
      - kafka
      - postgres

  jobmanager:
    build: ./flink
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./flink:/opt/flink/sql
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2

  taskmanager:
    build: ./flink
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2

  flink-sql-client:
    build: ./flink
    depends_on:
      - jobmanager
      - taskmanager
      - kafka
    volumes:
      - ./flink:/opt/flink/sql
    environment:
      - FLINK_JOBMANAGER_HOST=jobmanager
    command: >
      bash -c "
        echo 'Waiting for Flink JobManager and Kafka to be ready...';
        sleep 40;
        echo 'Submitting fraud detection job...';
        sql-client.sh -f /opt/flink/sql/fraud_job.sql;
        echo 'Job submitted. Keeping container alive...';
        tail -f /dev/null
      "

